name: CI Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: neoforge
            minecraft: "1.21.1"
            java: "21"
            build_task: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Build and test (with retry)
        run: |
          for attempt in 1 2 3; do
            ./gradlew --no-daemon test ${{ matrix.build_task }} && exit 0
            echo "Attempt ${attempt} failed"
            if [ "$attempt" -eq 3 ]; then
              echo "Build failed after 3 attempts"
              exit 1
            fi
            sleep 15
          done

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.loader }}-mc${{ matrix.minecraft }}
          path: |
            build/reports/tests/test/**
            build/test-results/test/**

      - name: Upload jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.loader }}-mc${{ matrix.minecraft }}
          path: build/libs/*.jar
