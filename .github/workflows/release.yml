name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: neoforge
            minecraft: "1.21.1"
            java: "21"
            build_task: build
            neo_version: "21.1.229"
          - loader: neoforge
            minecraft: "1.21.2"
            java: "21"
            build_task: build
            neo_version: "21.2.1-beta"
          - loader: neoforge
            minecraft: "1.21.3"
            java: "21"
            build_task: build
            neo_version: "21.3.96"
          - loader: neoforge
            minecraft: "1.21.4"
            java: "21"
            build_task: build
            neo_version: "21.4.157"
          - loader: neoforge
            minecraft: "1.21.5"
            java: "21"
            build_task: build
            neo_version: "21.5.97"
          - loader: neoforge
            minecraft: "1.21.6"
            java: "21"
            build_task: build
            neo_version: "21.6.20-beta"
          - loader: neoforge
            minecraft: "1.21.7"
            java: "21"
            build_task: build
            neo_version: "21.7.25-beta"
          - loader: neoforge
            minecraft: "1.21.8"
            java: "21"
            build_task: build
            neo_version: "21.8.53"
          - loader: neoforge
            minecraft: "1.21.9"
            java: "21"
            build_task: build
            neo_version: "21.9.16-beta"
          - loader: neoforge
            minecraft: "1.21.10"
            java: "21"
            build_task: build
            neo_version: "21.10.64"
          - loader: neoforge
            minecraft: "1.21.11"
            java: "21"
            build_task: build
            neo_version: "21.11.42"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Resolve mod version from tag
        id: mod
        run: |
          REF_NAME="${GITHUB_REF_NAME}"
          if [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            MOD_VERSION="${REF_NAME#v}"
          else
            MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          fi
          echo "mod_version=${MOD_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and test (NeoForge, with retry)
        if: matrix.loader == 'neoforge'
        run: |
          for attempt in 1 2 3; do
            ./gradlew --no-daemon \
              -Pmod_version=${{ steps.mod.outputs.mod_version }} \
              -Pminecraft_version=${{ matrix.minecraft }} \
              -Pminecraft_version_range='[1.21,1.22)' \
              -Pneo_version=${{ matrix.neo_version }} \
              test ${{ matrix.build_task }} && exit 0
            echo "Attempt ${attempt} failed"
            if [ "$attempt" -eq 3 ]; then
              echo "Build failed after 3 attempts"
              exit 1
            fi
            sleep 15
          done

      - name: Collect normalized artifacts
        run: |
          mkdir -p release-assets
          base="mcdiscordbridge-${{ matrix.loader }}-mc${{ matrix.minecraft }}-${{ steps.mod.outputs.mod_version }}"
          main_jar="build/libs/mcdiscordbridge-${{ steps.mod.outputs.mod_version }}.jar"
          sources_jar="build/libs/mcdiscordbridge-${{ steps.mod.outputs.mod_version }}-sources.jar"

          if [ -f "$main_jar" ]; then
            cp "$main_jar" "release-assets/${base}.jar"
          fi

          if [ -f "$sources_jar" ]; then
            cp "$sources_jar" "release-assets/${base}-sources.jar"
          fi

      - name: Upload matrix artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.loader }}-mc${{ matrix.minecraft }}
          path: release-assets/*.jar

  publish-release:
    runs-on: ubuntu-latest
    needs: build-matrix
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-assets

      - name: Flatten assets
        run: |
          mkdir -p final-assets
          find all-assets -name "*.jar" -exec cp {} final-assets/ \;

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v3
        with:
          name: "${{ github.ref_name }} • MC Discord Bridge"
          files: final-assets/*.jar
          generate_release_notes: true
