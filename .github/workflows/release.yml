name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: neoforge
            minecraft: "1.21.1"
            java: "21"
            build_task: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Minecraft version
        id: meta
        run: |
          MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)
          echo "mc_version=${MC_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Build and test (with retry)
        run: |
          for attempt in 1 2 3; do
            ./gradlew --no-daemon test ${{ matrix.build_task }} && exit 0
            echo "Attempt ${attempt} failed"
            if [ "$attempt" -eq 3 ]; then
              echo "Build failed after 3 attempts"
              exit 1
            fi
            sleep 15
          done

      - name: Collect artifacts
        run: |
          mkdir -p release-assets
          cp build/libs/*.jar release-assets/

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }} for mc${{ steps.meta.outputs.mc_version }}"
          files: release-assets/*.jar
          generate_release_notes: true
