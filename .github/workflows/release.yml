name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: neoforge
            minecraft: "1.21.1"
            java: "21"
            build_task: build
            neo_version: "21.1.229"
          - loader: neoforge
            minecraft: "1.21.2"
            java: "21"
            build_task: build
            neo_version: "21.2.1-beta"
          - loader: neoforge
            minecraft: "1.21.3"
            java: "21"
            build_task: build
            neo_version: "21.3.96"
          - loader: neoforge
            minecraft: "1.21.4"
            java: "21"
            build_task: build
            neo_version: "21.4.157"
          - loader: neoforge
            minecraft: "1.21.5"
            java: "21"
            build_task: build
            neo_version: "21.5.97"
          - loader: neoforge
            minecraft: "1.21.6"
            java: "21"
            build_task: build
            neo_version: "21.6.20-beta"
          - loader: neoforge
            minecraft: "1.21.7"
            java: "21"
            build_task: build
            neo_version: "21.7.25-beta"
          - loader: neoforge
            minecraft: "1.21.8"
            java: "21"
            build_task: build
            neo_version: "21.8.53"
          - loader: neoforge
            minecraft: "1.21.9"
            java: "21"
            build_task: build
            neo_version: "21.9.16-beta"
          - loader: neoforge
            minecraft: "1.21.10"
            java: "21"
            build_task: build
            neo_version: "21.10.64"
          - loader: neoforge
            minecraft: "1.21.11"
            java: "21"
            build_task: build
            neo_version: "21.11.42"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Resolve mod version from tag
        id: mod
        run: |
          REF_NAME="${GITHUB_REF_NAME}"
          if [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            MOD_VERSION="${REF_NAME#v}"
          else
            MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          fi
          echo "mod_version=${MOD_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and test (NeoForge, with retry)
        if: matrix.loader == 'neoforge'
        run: |
          for attempt in 1 2 3; do
            ./gradlew --no-daemon \
              -Pmod_version=${{ steps.mod.outputs.mod_version }} \
              -Pminecraft_version=${{ matrix.minecraft }} \
              -Pminecraft_version_range='[1.21,1.22)' \
              -Pneo_version=${{ matrix.neo_version }} \
              test ${{ matrix.build_task }} && exit 0
            echo "Attempt ${attempt} failed"
            if [ "$attempt" -eq 3 ]; then
              echo "Build failed after 3 attempts"
              exit 1
            fi
            sleep 15
          done

      - name: Collect normalized artifacts
        run: |
          mkdir -p release-assets
          base="mcdiscordbridge-${{ matrix.loader }}-mc${{ matrix.minecraft }}-${{ steps.mod.outputs.mod_version }}"
          main_jar="build/libs/mcdiscordbridge-${{ steps.mod.outputs.mod_version }}.jar"
          sources_jar="build/libs/mcdiscordbridge-${{ steps.mod.outputs.mod_version }}-sources.jar"

          if [ -f "$main_jar" ]; then
            cp "$main_jar" "release-assets/${base}.jar"
          fi

          if [ -f "$sources_jar" ]; then
            cp "$sources_jar" "release-assets/${base}-sources.jar"
          fi

      - name: Upload matrix artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.loader }}-mc${{ matrix.minecraft }}
          path: release-assets/*.jar

  publish-release:
    runs-on: ubuntu-latest
    needs: build-matrix
    env:
      MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: all-assets

      - name: Flatten assets
        run: |
          mkdir -p final-assets
          find all-assets -name "*.jar" -exec cp {} final-assets/ \;

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v3
        with:
          name: "${{ github.ref_name }} • MC Discord Bridge"
          files: final-assets/*.jar
          generate_release_notes: true

      - name: Publish versions to Modrinth
        if: env.MODRINTH_PROJECT_ID != '' && env.MODRINTH_TOKEN != ''
        run: |
          set -euo pipefail

          if [[ ! -d final-assets ]]; then
            echo "final-assets directory is missing"
            exit 1
          fi

          if [[ "${GITHUB_REF_NAME}" =~ -alpha ]]; then
            VERSION_TYPE="alpha"
          elif [[ "${GITHUB_REF_NAME}" =~ -beta ]]; then
            VERSION_TYPE="beta"
          else
            VERSION_TYPE="release"
          fi

          CHANGELOG="Automated release for ${GITHUB_REF_NAME}"

          for jar in final-assets/*.jar; do
            if [[ ! -f "$jar" ]]; then
              continue
            fi

            file_name="$(basename "$jar")"

            if [[ "$file_name" == *"-sources.jar" ]]; then
              echo "Skipping sources artifact: $file_name"
              continue
            fi

            if [[ "$file_name" =~ ^mcdiscordbridge-neoforge-mc([0-9]+\.[0-9]+\.[0-9]+)-(.+)\.jar$ ]]; then
              MC_VERSION="${BASH_REMATCH[1]}"
              BASE_VERSION="${BASH_REMATCH[2]}"
            else
              echo "Skipping unknown artifact name format: $file_name"
              continue
            fi

            VERSION_NUMBER="${BASE_VERSION}+mc${MC_VERSION}"
            VERSION_NAME="MC Discord Bridge ${BASE_VERSION} for MC ${MC_VERSION}"

            echo "Checking whether version already exists: ${VERSION_NUMBER}"
            existing_count="$(curl -sS \
              -H "Authorization: ${MODRINTH_TOKEN}" \
              -H "User-Agent: faga/mcdiscordbridge-release-ci" \
              "https://api.modrinth.com/v2/project/${MODRINTH_PROJECT_ID}/version" \
              | jq --arg version_number "${VERSION_NUMBER}" '[.[] | select(.version_number == $version_number)] | length')"

            if [[ "$existing_count" != "0" ]]; then
              echo "Version already exists on Modrinth, skipping: ${VERSION_NUMBER}"
              continue
            fi

            data_json="$(jq -n \
              --arg name "${VERSION_NAME}" \
              --arg version_number "${VERSION_NUMBER}" \
              --arg changelog "${CHANGELOG}" \
              --arg project_id "${MODRINTH_PROJECT_ID}" \
              --arg game_version "${MC_VERSION}" \
              --arg loader "neoforge" \
              --arg version_type "${VERSION_TYPE}" \
              '{
                name: $name,
                version_number: $version_number,
                changelog: $changelog,
                dependencies: [],
                game_versions: [$game_version],
                version_type: $version_type,
                loaders: [$loader],
                featured: false,
                status: "listed",
                project_id: $project_id,
                file_parts: ["file"],
                primary_file: "file"
              }')"

            response_code="$(curl -sS -o /tmp/modrinth-response.json -w "%{http_code}" \
              -X POST "https://api.modrinth.com/v2/version" \
              -H "Authorization: ${MODRINTH_TOKEN}" \
              -H "User-Agent: faga/mcdiscordbridge-release-ci" \
              -F "data=${data_json}" \
              -F "file=@${jar}")"

            if [[ "$response_code" -lt 200 || "$response_code" -ge 300 ]]; then
              echo "Failed to upload ${file_name} (HTTP ${response_code})"
              cat /tmp/modrinth-response.json
              exit 1
            fi

            echo "Uploaded ${file_name} as ${VERSION_NUMBER}"
          done

      - name: Warn when Modrinth secrets are missing
        if: env.MODRINTH_PROJECT_ID == '' || env.MODRINTH_TOKEN == ''
        run: |
          echo "Skipping Modrinth publish because MODRINTH_PROJECT_ID or MODRINTH_TOKEN is not configured."
